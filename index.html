<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loja do Zé</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="pagina">
        <main class="card">
            <header class="card-cabecalho">
                <h1>Loja do Zé</h1>
                <p class="card-subtitulo">Gerencie as categorias de produtos</p>
            </header>
            <div class="card-corpo">
                <section class="secao-form">
                    <h2>Nova categoria</h2>
                    <form id="form-categoria" class="form-categoria">
                        <input type="text" id="descricao" placeholder="Ex.: Brinquedos" required maxlength="120">
                        <div class="buttonDiv">
                            <button id="btnCadastrar" type="submit" class="btn btn-cadastrar">Cadastrar</button>
                            <button id="btnLimpar" type="reset" class="btn btn-limpar">Limpar</button>
                        </div>
                    </form>
                    <p id="mensagem" class="mensagem" role="status" aria-live="polite"></p>
                </section>
                <section class="secao-lista">
                    <h2>Categorias</h2>
                    <ul id="lista-categorias" class="lista-categorias"></ul>
                </section>
            </div>
        </main>
    </div>
    <script src="/app.js" defer></script>
</body>
</html>
